name: Semantica Decathlon native validation

on:
  push:
    branches:
      - semantica-decathlon-native-validation
    paths-ignore:
      - 'experiments/semantica-decathlon/results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight Semantica KG stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps 'semantica==0.6.8'
          python -m pip install numpy scipy networkx gensim pyyaml pydantic loguru tqdm python-dateutil

      - name: Run native Semantica validation
        env:
          SEMANTICA_DISABLE_PROGRESS: '1'
        run: |
          python experiments/semantica-decathlon/run_validation_v2.py

      - name: Show summary
        if: always()
        run: |
          cat experiments/semantica-decathlon/results/summary.md || true
          echo '--- JSON head ---'
          head -n 160 experiments/semantica-decathlon/results/native_results.json || true

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantica-decathlon-native-results
          path: experiments/semantica-decathlon/results/
          if-no-files-found: error

      - name: Commit results to validation branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/semantica-decathlon/results/
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Store native Semantica validation results [skip ci]'
            git push
          fi
